<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Podcast Episodes | Summeries & Sound</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles.css">
</head>
<body>
    <nav class="nav">
        <div class="logo">Summeries & Sound</div>
        <a class="cta" href="../index.html">Back Home</a>
    </nav>

    <main class="listing-main">
        <a class="back-link" href="../index.html#podcasts">← Back to featured episodes</a>
        <header class="listing-header">
            <h1>All Podcast Episodes</h1>
            <p>Browse every audio drop in one place. Duplicate a card below each time you publish a new episode.</p>
        </header>

        <section class="section podcasts">
            <div class="card-grid" id="podcasts-container">
                <!-- Podcasts will be dynamically loaded here -->
            </div>
        </section>
    </main>

    <footer class="footer">
        <p>© <span id="year"></span> Summeries & Sound. Curated with care.</p>
        <div class="footer-links">
            <a href="../index.html#summaries">Books</a>
            <a href="../index.html#podcasts">Featured</a>
            <a href="../about/index.html">About</a>
            <a href="../contact/index.html">Contact</a>
        </div>
    </footer>

    <script src="../scripts/render-podcasts.js"></script>
    <script>
        document.getElementById('year').textContent = new Date().getFullYear();
        
        // Load all podcasts for listing page
        async function loadAllPodcasts() {
            try {
                const response = await fetch('../data/podcasts.json');
                const data = await response.json();
                const container = document.getElementById('podcasts-container');
                if (container) {
                    // Sort podcasts by dateAdded (newest first)
                    const sortedPodcasts = [...data.podcasts].sort((a, b) => {
                        const dateA = new Date(a.dateAdded || a.releaseDate || 0);
                        const dateB = new Date(b.dateAdded || b.releaseDate || 0);
                        return dateB - dateA; // Newest first
                    });
                    
                    sortedPodcasts.forEach(podcast => {
                        const card = document.createElement('article');
                        card.className = 'podcast-card';
                        card.innerHTML = `
                            <a class="card-media" href="${podcast.id}/index.html">
                                <img src="${podcast.coverImageThumb}" alt="${podcast.title} cover art">
                            </a>
                            <div class="episode-meta">Episode ${podcast.episodeNumber} · ${podcast.length}</div>
                            <h3><a href="${podcast.id}/index.html" class="card-title">${podcast.title}</a></h3>
                            <p>${podcast.description}</p>
                            <a href="${podcast.id}/index.html" class="text-link">Listen to episode</a>
                        `;
                        container.appendChild(card);
                    });
                }
            } catch (error) {
                console.error('Error loading podcasts:', error);
            }
        }
        
        document.addEventListener('DOMContentLoaded', loadAllPodcasts);
    </script>
</body>
</html>
