<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Book Summaries | Summeries & Sound</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles.css">
</head>
<body>
    <nav class="nav">
        <div class="logo">Summeries & Sound</div>
        <a class="cta" href="../index.html">Back Home</a>
    </nav>

    <main class="listing-main">
        <a class="back-link" href="../index.html#summaries">← Back to featured summaries</a>
        <header class="listing-header">
            <h1>All Book Summaries</h1>
            <p>Explore every condensed breakdown and audio companion. Duplicate one of the cards below whenever you add a new title.</p>
        </header>

        <section class="section summaries">
            <div class="card-grid" id="books-container">
                <!-- Books will be dynamically loaded here -->
            </div>
        </section>
    </main>

    <footer class="footer">
        <p>© <span id="year"></span> Summeries & Sound. Curated with care.</p>
        <div class="footer-links">
            <a href="../index.html#summaries">Featured</a>
            <a href="../podcasts/index.html">Podcasts</a>
            <a href="../about/index.html">About</a>
            <a href="../contact/index.html">Contact</a>
        </div>
    </footer>

    <script src="../scripts/render-books.js"></script>
    <script>
        document.getElementById('year').textContent = new Date().getFullYear();
        
        // Load all books for listing page
        async function loadAllBooks() {
            try {
                const response = await fetch('../data/books.json');
                const data = await response.json();
                const container = document.getElementById('books-container');
                if (container) {
                    // Sort books by dateAdded (newest first)
                    const sortedBooks = [...data.books].sort((a, b) => {
                        const dateA = new Date(a.dateAdded || a.releaseDate || 0);
                        const dateB = new Date(b.dateAdded || b.releaseDate || 0);
                        return dateB - dateA; // Newest first
                    });
                    
                    sortedBooks.forEach(book => {
                        const card = document.createElement('article');
                        card.className = 'summary-card';
                        card.innerHTML = `
                            <a class="card-media" href="${book.id}/index.html">
                                <img src="${book.coverImageThumb}" alt="${book.title} book cover">
                            </a>
                            <span class="pill">${book.category}</span>
                            <h3><a href="${book.id}/index.html" class="card-title">${book.title}</a></h3>
                            <p>${book.description}</p>
                            <a href="${book.id}/index.html" class="text-link">View summary & audio</a>
                        `;
                        container.appendChild(card);
                    });
                }
            } catch (error) {
                console.error('Error loading books:', error);
            }
        }
        
        document.addEventListener('DOMContentLoaded', loadAllBooks);
    </script>
</body>
</html>
